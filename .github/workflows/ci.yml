name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: false
      - name: reasonr and reasonrd
        run: make tools && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: format, check, acceptance tests
        run: make check
